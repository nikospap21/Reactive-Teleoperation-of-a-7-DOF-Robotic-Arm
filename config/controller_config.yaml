# ==========================================
# PS2 Controller Mapping & Teleop Settings
# ==========================================

network:
  ip: "0.0.0.0"
  port: 5005

controller:
  device_index: 0     # ID συσκευής στο pygame
  deadzone: 0.5       # Κατώφλι κάτω από το οποίο αγνοείται η είσοδος (0.0 - 1.0)
  update_rate_hz: 50  # Συχνότητα polling του χειριστηρίου (Hz)

axes:
  axis_x: 1   # Αριστερός μοχλός: Οριζόντιος (κίνηση Y ή X του ρομπότ)
  axis_y: 0   # Αριστερός μοχλός: Κατακόρυφος (κίνηση X ή Y του ρομπότ)
  axis_z: 3   # Δεξιός μοχλός: Κατακόρυφος (κίνηση Z - πάνω/κάτω)
  rot: 2

scales:
  linear_x: 0.05   # 5 cm/s max
  linear_y: 0.05
  linear_z: 0.05
  angular_yaw: 0.2 # ~11.5 deg/s max

buttons:
  gripper_on: 0   # Button A
  gripper_off: 1  # Button B
