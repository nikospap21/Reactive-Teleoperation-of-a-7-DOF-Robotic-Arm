# ==========================================
# PS2 Controller Mapping & Teleop Settings
# ==========================================

controller:
  device_index: 0              # ID συσκευής στο pygame
  deadzone: 0.08               # Κατώφλι κάτω από το οποίο αγνοείται η είσοδος (0.0 - 1.0)
  update_rate_hz: 30           # Συχνότητα polling του χειριστηρίου (Hz)

# Αντιστοίχιση αξόνων για μετατόπιση (Translation: vx, vy, vz σε m/s)
translation:
  axis_x: 0                    # Αριστερός μοχλός: Οριζόντιος (κίνηση Y ή X του ρομπότ)
  axis_y: 1                    # Αριστερός μοχλός: Κατακόρυφος (κίνηση X ή Y του ρομπότ)
  axis_z: 3                    # Δεξιός μοχλός: Κατακόρυφος (κίνηση Z - πάνω/κάτω)
  
  # Αντιστροφή αξόνων (1.0 κανονικό, -1.0 αντεστραμμένο)
  scale_x: 0.05                # Μέγιστη ταχύτητα X (m/s)
  scale_y: 0.05                # Μέγιστη ταχύτητα Y (m/s)
  scale_z: 0.04                # Μέγιστη ταχύτητα Z (m/s)
  invert_y: true               # Οι μοχλοί συνήθως έχουν -1 στο "πάνω"

# Αντιστοίχιση αξόνων για προσανατολισμό (Rotation: wx, wy, wz σε rad/s)
rotation:
  axis_yaw: 2                  # Δεξιός μοχλός: Οριζόντιος (περιστροφή yaw)
  scale_yaw: 0.2               # Μέγιστη γωνιακή ταχύτητα (rad/s)
  invert_yaw: false

# Αντιστοίχιση πλήκτρων (Button IDs)
buttons:
  vacuum_on: 4                 # Πλήκτρο L1: Ενεργοποίηση αναρρόφησης (suction ON)
  vacuum_off: 5                # Πλήκτρο R1: Απενεργοποίηση αναρρόφησης (suction OFF)
  emergency_stop: 9            # Πλήκτρο Start ή Select: Άμεσο σταμάτημα
  home_position: 8             # Πλήκτρο επαναφοράς σε αρχική στάση (Home pose)
